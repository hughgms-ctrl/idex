<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ide.x</title>
    <meta name="description" content="Escala, repertório e presença do ministério de louvor" />
    <meta name="theme-color" content="#0e0f12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ide.x" />
    <script>
      // Arquivo do app que não carregou (ex.: versão nova publicada enquanto o app estava
      // aberto): recarrega uma vez, em vez de mostrar a tela sem estilo.
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target
          if (!t || (t.tagName !== 'LINK' && t.tagName !== 'SCRIPT')) return
          try {
            if (sessionStorage.getItem('idex.assetReload')) return
            sessionStorage.setItem('idex.assetReload', '1')
          } catch (_) {
            return
          }
          location.reload()
        },
        true,
      )
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
